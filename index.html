<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-mood="clear" data-night="0">
    <div class="wrap">
      <h1 class="sr">Weather dashboard</h1>

      <header class="top">
        <div class="brand" aria-hidden="true">
          <div class="logo">
            <svg class="i" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </div>
          <span>Weather</span>
        </div>
        <form class="search" id="form" novalidate>
          <div class="field">
            <svg class="i" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
            <input
              id="q"
              type="text"
              role="combobox"
              aria-label="City name"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="sugg"
              placeholder="Search a city"
              autocomplete="off"
              spellcheck="false"
              maxlength="60"
            />
            <ul
              id="sugg"
              role="listbox"
              aria-label="Matching locations"
              hidden
            ></ul>
          </div>
          <button class="btn primary" id="go" type="submit">Search</button>
          <button
            class="btn icon"
            type="button"
            id="loc"
            aria-label="Use my location"
            title="Use my location"
          >
            <svg class="i" viewBox="0 0 24 24">
              <path
                d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"
              />
              <circle cx="12" cy="9.5" r="2.5" />
            </svg>
          </button>
        </form>
        <div class="unit" role="group" aria-label="Temperature unit">
          <button type="button" data-u="c" aria-pressed="true">°C</button>
          <button type="button" data-u="f" aria-pressed="false">°F</button>
        </div>
      </header>
      <div class="recent" id="recent" aria-label="Recent searches"></div>
      <div id="msg" role="status" aria-live="polite"></div>

      <div class="dash" id="view" aria-live="polite">
        <div class="col">
          <section class="now glass">
            <div class="place" id="place"></div>
            <div class="date" id="time"></div>
            <div class="now-main">
              <div class="temp" id="temp"></div>
              <img id="icon" alt="" />
            </div>
            <div class="cond" id="cond"></div>
            <div class="hl" id="hl"></div>
          </section>
          <section class="panel glass">
            <h2>5-day forecast</h2>
            <div id="days"></div>
          </section>
        </div>
        <div class="col">
          <section class="panel glass">
            <h2>Next 24 hours</h2>
            <div class="hours" id="hours"></div>
          </section>
          <div class="tiles" id="tiles"></div>
        </div>
      </div>

      <footer>
        Data from
        <a href="https://openweathermap.org/" target="_blank" rel="noopener"
          >OpenWeatherMap</a
        >.
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
